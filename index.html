<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hobo House Hub</title>

<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

<style>

:root{
  --border:#e5e7eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:30px;
  font-family:Inter,Arial,sans-serif;

  min-height:100vh;

  background:
    radial-gradient(circle at 15% 20%, rgba(255,140,180,.28), transparent 40%),
    radial-gradient(circle at 85% 25%, rgba(120,180,255,.28), transparent 42%),
    radial-gradient(circle at 50% 85%, rgba(170,255,210,.22), transparent 45%),
    linear-gradient(135deg,#f8fbff,#eef3ff,#fff1f6,#f6fbff);

  background-attachment:fixed;
}

/* floating blobs */
body::before{
  content:"";
  position:fixed;
  inset:-40%;
  z-index:-1;

  background:
    radial-gradient(circle at 20% 30%, rgba(255,120,180,.45), transparent 40%),
    radial-gradient(circle at 70% 20%, rgba(120,180,255,.45), transparent 42%),
    radial-gradient(circle at 50% 80%, rgba(170,255,210,.35), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(255,210,120,.25), transparent 50%);

  filter:blur(45px) saturate(.75);

  animation:blobMove 14s ease-in-out infinite alternate;
}

@keyframes blobMove{
  0%{transform:translate3d(-6%,-4%,0) scale(1.1);}
  50%{transform:translate3d(4%,6%,0) scale(1.2);}
  100%{transform:translate3d(-3%,8%,0) scale(1.15);}
}

/* HEADER */
.header{
  text-align:center;

  background:rgba(255,255,255,.18);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border:1px solid rgba(255,255,255,.25);
  border-radius:20px;

  padding:25px;
  margin-bottom:25px;

  box-shadow:0 18px 40px rgba(0,0,0,.08);
}

.title{
  font-family:"DotGothic16",sans-serif;
  font-size:34px;
  letter-spacing:2px;

  background:linear-gradient(135deg,#2563eb,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  margin:0;
}

.subtitle{
  margin-top:10px;
  color:#475569;
  font-size:14px;
}

/* GRID */
.app-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

/* CARD */
.app-card{
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border:1px solid rgba(255,255,255,.25);
  border-radius:26px;

  padding:22px;

  cursor:pointer;
  text-align:center;

  position:relative;
  overflow:hidden;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

/* shine layer */
.app-card::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.25), transparent 55%),
    radial-gradient(circle at 70% 80%, rgba(180,220,255,.12), transparent 60%);

  pointer-events:none;
}

/* hover */
.app-card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:
    0 30px 70px rgba(0,0,0,.12),
    0 10px 20px rgba(37,99,235,.12);

  border-color:rgba(96,165,250,.35);
}

/* click feel */
.app-card:active{
  transform:translateY(-2px) scale(0.99);
}

/* icon */
.app-icon{
  font-size:42px;
  margin-bottom:12px;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.08));
}

/* name */
.app-name{
  font-size:18px;
  font-weight:700;
  color:#111827;
  margin-bottom:6px;
}

/* desc */
.app-desc{
  font-size:13px;
  color:#64748b;
  line-height:1.4;
}

/* glow pulse */
.app-card::after{
  content:"";
  position:absolute;
  inset:-40%;
  background:radial-gradient(circle, rgba(96,165,250,.15), transparent 60%);
  opacity:0;
  transition:opacity .3s ease;
}

.app-card:hover::after{
  opacity:1;
}

/* FOOTER */
.footer{
  margin-top:30px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}

</style>
</head>

<body>

<div class="header">
  <h1 class="title">HOBO HOUSE HUB</h1>
  <div class="subtitle">idk what I'm doing</div>
</div>

<div class="app-grid">

  <div class="app-card" onclick="location.href='laundry.html'">
    <div class="app-icon">🧺</div>
    <div class="app-name">Laundry Scheduler</div>
    <div class="app-desc">Reserve washing machine slots.</div>
  </div>

  <div class="app-card" onclick="location.href='chores.html'">
    <div class="app-icon">🧹</div>
    <div class="app-name">Housework Tracker</div>
    <div class="app-desc">Track whose turn it is to do housework.</div>
  </div>

  <div class="app-card" onclick="location.href='rent.html'">
    <div class="app-icon">💰</div>
    <div class="app-name">Rent Tracker</div>
    <div class="app-desc">Monitor rent payment status.</div>
  </div>

  <div class="app-card">
    <div class="app-icon">➕</div>
    <div class="app-name">Coming Soon</div>
    <div class="app-desc">More tools coming soon.</div>
  </div>

</div>

<div class="footer">
  Vibe coded by Hermen
</div>

</body>
</html>
